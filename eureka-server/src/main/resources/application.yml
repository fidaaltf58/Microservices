server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  # Standalone registry: the service URL must resolve to this instance's own hostname,
  # otherwise Eureka treats itself as a peer and replicates every registration to itself.
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics