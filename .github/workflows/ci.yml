name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only token by default
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.12.2
  CHECKOV_VERSION: 3.3.30
  KUBECONFORM_VERSION: v0.7.0

jobs:
  build-test:
    name: Build & test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [eureka-server, config-server, api-gateway, product-service, order-service]
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved by an attacker)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven verify
        working-directory: ${{ matrix.service }}
        run: mvn -B verify

  container:
    name: Image lint & scan (${{ matrix.service }})
    needs: build-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [eureka-server, config-server, api-gateway, product-service, order-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ecommerce/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan image (Trivy) - fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecommerce/${{ matrix.service }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  iac:
    name: Terraform & Kubernetes checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate

      - name: Render Kubernetes manifests
        run: |
          for f in k8s/overlays/local/databases/*.env.example; do cp "$f" "${f%.example}"; done
          # Render the AWS overlay exactly as deploy.yml does: images pinned to the commit SHA
          mkdir -p rendered release
          {
            echo "apiVersion: kustomize.config.k8s.io/v1beta1"
            echo "kind: Kustomization"
            echo "resources: [../k8s/overlays/aws]"
            echo "images:"
            for s in eureka-server config-server api-gateway product-service order-service; do
              echo "  - { name: ecommerce/$s, newName: 123456789012.dkr.ecr.eu-west-3.amazonaws.com/ecommerce/$s, newTag: \"$GITHUB_SHA\" }"
            done
          } > release/kustomization.yaml
          kubectl kustomize release            > rendered/aws.yaml
          kubectl kustomize k8s/overlays/local > rendered/local.yaml
      - name: Validate manifests against the Kubernetes 1.33 schema (kubeconform)
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/aws.yaml rendered/local.yaml

      - name: Install Checkov
        run: pip install "checkov==${CHECKOV_VERSION}"
      - name: Checkov - Terraform
        run: checkov -d infra/terraform --framework terraform --skip-path .terraform --compact --quiet
      - name: Checkov - Kubernetes (AWS overlay as deployed)
        run: checkov -f rendered/aws.yaml --framework kubernetes --compact --quiet
      - name: Checkov - Dockerfiles
        run: checkov -d . --framework dockerfile --compact --quiet

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
