# Applied once by a cluster admin (scripts/bootstrap-cluster.sh), not by CI/CD.
# Pod Security Admission "restricted": the API server rejects any pod that runs as root,
# allows privilege escalation, keeps capabilities, or skips the seccomp profile.
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
