# Database credentials are synced from AWS Secrets Manager (written by Terraform, KMS-encrypted)
# into Kubernetes Secrets by External Secrets Operator. No credential is stored in git.
# The ClusterSecretStore "aws-secrets-manager" is created by scripts/bootstrap-cluster.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: product-db
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef: { key: ecommerce-dev/product-db, property: url }
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: { key: ecommerce-dev/product-db, property: username }
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: { key: ecommerce-dev/product-db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: order-db
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef: { key: ecommerce-dev/order-db, property: url }
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: { key: ecommerce-dev/order-db, property: username }
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: { key: ecommerce-dev/order-db, property: password }
