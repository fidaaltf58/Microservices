apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: { app.kubernetes.io/name: mysql }
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mysql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - { name: MYSQL_DATABASE, value: productdb }
            - { name: MYSQL_RANDOM_ROOT_PASSWORD, value: "yes" }
            - name: MYSQL_USER
              valueFrom: { secretKeyRef: { name: product-db, key: SPRING_DATASOURCE_USERNAME } }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: product-db, key: SPRING_DATASOURCE_PASSWORD } }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\""]
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 2Gi }
