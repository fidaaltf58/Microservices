apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local-only stand-ins for RDS, in their own namespace (the official DB images start as root,
# which the "restricted" policy on the app namespace would reject).
namespace: ecommerce-data

resources:
  - namespace.yaml
  - mysql.yaml
  - postgres.yaml

secretGenerator:
  - name: product-db
    envs: [product-db.env]
  - name: order-db
    envs: [order-db.env]
