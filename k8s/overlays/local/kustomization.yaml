apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local cluster (kind / minikube / Docker Desktop):
#   cp k8s/overlays/local/databases/product-db.env.example k8s/overlays/local/databases/product-db.env
#   cp k8s/overlays/local/databases/order-db.env.example   k8s/overlays/local/databases/order-db.env
#   kubectl apply -k k8s/overlays/local
resources:
  - ../../namespace
  - ../../base
  - databases

images:
  - { name: ecommerce/eureka-server, newTag: local }
  - { name: ecommerce/config-server, newTag: local }
  - { name: ecommerce/api-gateway, newTag: local }
  - { name: ecommerce/product-service, newTag: local }
  - { name: ecommerce/order-service, newTag: local }

# Images are built locally and loaded into the cluster, never pulled
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

secretGenerator:
  - name: product-db
    namespace: ecommerce
    envs: [databases/product-db.env]
  - name: order-db
    namespace: ecommerce
    envs: [databases/order-db.env]
