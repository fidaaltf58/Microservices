# Service registry (Netflix Eureka)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eureka-server
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  annotations:
    checkov.io/skip1: CKV_K8S_43=Images are referenced by immutable, scanned ECR tags (git SHA) set at deploy time
    checkov.io/skip2: CKV_K8S_35=Spring Boot reads datasource settings from environment variables
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: eureka-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eureka-server
    spec:
      serviceAccountName: eureka-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eureka-server
          image: ecommerce/eureka-server
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8761
          # Not the shared client ConfigMap: the registry keeps its standalone settings from application.yml
          env:
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Spring Boot exposes /actuator/health/liveness and /readiness automatically on Kubernetes
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server
spec:
  selector:
    app.kubernetes.io/name: eureka-server
  ports:
    - name: http
      port: 8761
      targetPort: http
