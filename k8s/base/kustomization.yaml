apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Application workloads only: everything here is namespace-scoped, so the CI/CD role
# (EKS access policy scoped to this namespace) can apply it without cluster-admin.
namespace: ecommerce

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce
    includeSelectors: false
    includeTemplates: true

resources:
  - app-config.yaml
  - eureka-server.yaml
  - config-server.yaml
  - api-gateway.yaml
  - product-service.yaml
  - order-service.yaml
  - network-policies.yaml
  - autoscaling.yaml
