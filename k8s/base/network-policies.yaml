# Zero-trust networking inside the namespace: deny everything, then allow only the calls the
# architecture needs. Enforced on EKS by the VPC CNI network-policy agent (enabled in Terraform).
#
#   internet -> api-gateway -> product-service -> MySQL
#                          \-> order-service ---^ (Feign) -> PostgreSQL
#   gateway / product / order -> eureka-server (registration + discovery)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eureka-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: eureka-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["api-gateway", "product-service", "order-service", "config-server"]
      ports:
        - { protocol: TCP, port: 8761 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eureka-clients-egress
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["api-gateway", "product-service", "order-service", "config-server"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: eureka-server
      ports:
        - { protocol: TCP, port: 8761 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Public entry point (traffic arrives from the load balancer)
    - ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
      ports:
        - { protocol: TCP, port: 8081 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - { protocol: TCP, port: 8082 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product-service
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["api-gateway", "order-service"]
      ports:
        - { protocol: TCP, port: 8081 }
  egress:
    # MySQL (RDS on AWS, in-cluster StatefulSet locally)
    - ports:
        - { protocol: TCP, port: 3306 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - { protocol: TCP, port: 8082 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
      ports:
        - { protocol: TCP, port: 8081 }
    # PostgreSQL (RDS on AWS, in-cluster StatefulSet locally)
    - ports:
        - { protocol: TCP, port: 5432 }
